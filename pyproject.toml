[project]
name = "diffusionblocks-plusplus"
version = "0.1.0"
description = "Block-wise neural network training with parallel depth denoising, consistency, flow matching, MoE, and distillation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "DiffusionBlocks++ Contributors" },
]
keywords = ["deep-learning", "transformers", "diffusion", "block-wise-training", "flow-matching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "lightning>=2.5.0",
    "transformers>=4.52.4",
    "datasets>=3.5.0",
    "huggingface-hub[hf-xet]>=0.31.2",
    "hf-transfer>=0.1.9",
    # Math / Science
    "scipy>=1.16.2",
    "numpy>=1.26.0",
    # Logging / Tracking
    "wandb>=0.18.6",
    "tensorboard>=2.18.0",
    # Config / CLI
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    # Optional acceleration
    "flash-attn>=2.7.4",
    "xformers>=0.0.28",
    # Quantization (QLoRA)
    "bitsandbytes>=0.44.0",
    "peft>=0.13.0",
    # Image processing
    "pillow>=10.4.0",
    "albumentations>=1.4.0",
    # Metrics / eval
    "torchmetrics>=1.5.0",
    "einops>=0.8.0",
    # Testing
    "pytest>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
]

[project.scripts]
dblocks = "diffusionblocks.main:main"
diffusionblocks = "diffusionblocks.main:main"

[project.urls]
Homepage = "https://github.com/unifr/diffusionblocks-plusplus"
Paper = "https://arxiv.org/abs/2506.14202"
Original-Code = "https://github.com/SakanaAI/DiffusionBlocks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffusionblocks"]

# UV-specific: PyTorch CUDA index
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" }
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" }
]

# Ruff configuration
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

# MyPy
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
