name: Train fusion and image models

on:
  workflow_dispatch:
  push:
    branches: [training/model-matrix]
    tags: ['fusion-replay-*']
    # Start a new fit on data changes. Replay tags rebuild and score saved weights.
    paths:
      - experiments/model_matrix/prepare.py
      - experiments/model_matrix/cifar.py

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  RAYON_NUM_THREADS: 4

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: spatial-matrix-release
      - name: Build and certify the fused runtime
        run: |
          cargo build --locked --release --bin dblocks --example fused_scene --example mosme_image
          mkdir -p runtime
          cp target/release/dblocks target/release/examples/{fused_scene,mosme_image} runtime/
          ./runtime/dblocks verify --group geomfusion
      - uses: actions/upload-artifact@v4
        with:
          name: fusion-image-runtime
          path: runtime/
          if-no-files-found: error
          retention-days: 14

  backbone:
    if: github.ref_type == 'branch'
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: fusion-image-runtime
          path: runtime
      - name: Warm up the CPU-sized Qwen trunk on annotated-diagram scenes
        run: |
          chmod +x runtime/fused_scene
          python3 -B experiments/model_matrix/prepare.py data/scenes
          mkdir -p backbone
          ./runtime/fused_scene warmup --corpus data/scenes/train.geom.bin --steps 1500 --max-seconds 1800 --out backbone \
            | tee backbone/train.log
      - uses: actions/upload-artifact@v4
        with:
          name: fused-backbone-and-scenes
          path: |
            backbone/
            data/scenes/dataset.json
            data/scenes/train.geom.bin
            data/scenes/train.meta.json
            data/scenes/test.jsonl
          if-no-files-found: error
          retention-days: 14

  fusion:
    needs: backbone
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    strategy:
      fail-fast: false
      matrix:
        objective: [answer, diffusion]
    env:
      OBJECTIVE: ${{ matrix.objective }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: fusion-image-runtime
          path: runtime
      - uses: actions/download-artifact@v4
        with:
          name: fused-backbone-and-scenes
          path: inputs
      - name: Train, score and use the fused checkpoint
        run: |
          chmod +x runtime/fused_scene
          mkdir -p model
          cp inputs/data/scenes/{dataset.json,test.jsonl} model/
          ./runtime/fused_scene train --corpus inputs/data/scenes/train.geom.bin \
            --meta inputs/data/scenes/train.meta.json --backbone inputs/backbone/qwen-backbone-*.mpk \
            --objective "$OBJECTIVE" --steps 12 --out probe | tee model/probe.log
          steps=$(python3 -c 'import json; r=json.load(open("probe/model.json")); print(max(1, min(3000, int(1500 * r["steps_taken"] / r["elapsed_secs"]))))')
          cp probe/model.json model/throughput.json
          ./runtime/fused_scene train --corpus inputs/data/scenes/train.geom.bin \
            --meta inputs/data/scenes/train.meta.json --backbone inputs/backbone/qwen-backbone-*.mpk \
            --objective "$OBJECTIVE" --steps "$steps" --out model | tee model/train.log
          bash experiments/model_matrix/evaluate_fusion.sh ./runtime/fused_scene model "$OBJECTIVE"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: model-fusion-${{ matrix.objective }}
          path: model/
          if-no-files-found: error
          retention-days: 14

  mosme-image:
    if: github.ref_type == 'branch'
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: fusion-image-runtime
          path: runtime
      - name: Download and verify official CIFAR-100
        run: |
          python3 -m venv "$RUNNER_TEMP/cifar-data"
          data_python="$RUNNER_TEMP/cifar-data/bin/python"
          if "$data_python" -m pip install --only-binary=:all: pyarrow==26.0.1 Pillow \
             && "$data_python" -B experiments/model_matrix/cifar.py mirror cifar; then
            cat cifar/source.json
          else
            archive="$RUNNER_TEMP/cifar.tar.gz"
            for attempt in 1 2 3 4; do
              if curl --fail --silent --show-error --location --continue-at - --max-time 900 \
                https://cave.cs.toronto.edu/kriz/cifar-100-binary.tar.gz --output "$archive"; then break; fi
            done
            python3 -B experiments/model_matrix/cifar.py extract "$archive" cifar
          fi
      - name: Fit the MoSME image classifier
        run: |
          chmod +x runtime/dblocks runtime/mosme_image
          mkdir -p model
          ./runtime/dblocks experts init --out model/experts.json \
            --box natural:plants,animals --box human-made:tools,vehicles
          ./runtime/dblocks train --dataset cifar100 --data-dir cifar --objective dblock \
            --num-blocks 3 --batch-size 16 --steps 1400 --log-every 50 --lr-schedule cosine \
            --mosme-spec model/experts.json --mosme-every 2 --out-dir model/weights | tee model/train.log
          python3 -B experiments/model_matrix/cifar.py bundle cifar model
          ./runtime/mosme_image --bundle model --test > model/heldout.json
          ./runtime/mosme_image --bundle model | tee model/demo.json
          python3 -c 'import json; r=json.load(open("model/heldout.json")); print("CIFAR-100 top-1", r["correct"], "of", r["cases"])' \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: model-mosme-image
          path: model/
          if-no-files-found: error
          retention-days: 14

  replay:
    if: github.ref_type == 'tag'
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        objective: [answer, diffusion]
    env:
      OBJECTIVE: ${{ matrix.objective }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read source training run from the tag
        id: source
        run: |
          run_id="${GITHUB_REF_NAME#fusion-replay-}"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: fusion-image-runtime
          path: runtime
      - uses: actions/download-artifact@v4
        with:
          name: fused-backbone-and-scenes
          path: inputs
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: model-fusion-${{ matrix.objective }}
          path: model
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Restore, score and use the trained checkpoint
        run: |
          chmod +x runtime/fused_scene
          cmp inputs/data/scenes/test.jsonl model/test.jsonl
          cp inputs/backbone/qwen-backbone-*.mpk model/backbone.mpk
          bash experiments/model_matrix/evaluate_fusion.sh ./runtime/fused_scene model "$OBJECTIVE"
      - uses: actions/upload-artifact@v4
        with:
          name: model-fusion-${{ matrix.objective }}
          path: model/
          if-no-files-found: error
          retention-days: 14
